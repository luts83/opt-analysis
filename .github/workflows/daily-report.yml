name: Daily Options Report

# 실행 시각:
#  - 자동: 평일(월~금) 매일. cron 은 UTC 기준.
#    20:30 UTC ≈ 미 동부 16:30(장 마감 직후). 필요 시 조정하세요.
#  - 수동: Actions 탭에서 "Run workflow" 로 언제든 실행 가능(테스트용).
on:
  schedule:
    - cron: "30 20 * * 1-5"
  workflow_dispatch:

# 스냅샷을 repo 에 커밋해야 하므로 쓰기 권한 필요
permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run report
        env:
          # GitHub → Settings → Secrets and variables → Actions 에 등록
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python main.py | tee report_output.txt

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: |
            report_output.txt
            snapshots/**/*.json

      - name: Commit today's snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          if git diff --staged --quiet; then
            echo "커밋할 스냅샷 변경 없음"
          else
            git commit -m "chore: 옵션 스냅샷 $(date -u +%Y-%m-%d)"
            git push
          fi
