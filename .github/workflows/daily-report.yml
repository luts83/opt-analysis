name: Daily Options Report

# 영국 아침 자동 리포트
# 1) schedule (GitHub cron) — best-effort, 가끔 스킵됨
# 2) workflow_dispatch — 수동 / 외부 cron(cron-job.org 등) 호출용 ★권장
# 3) repository_dispatch — 외부 트리거 대안
on:
  schedule:
    - cron: "7 6 * * 2-6"
      timezone: Europe/London
    - cron: "37 6 * * 2-6"
      timezone: Europe/London
  workflow_dispatch:
  repository_dispatch:
    types: [daily-report]

concurrency:
  group: daily-options-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Skip if already completed today (London date)
        id: gate
        run: |
          TODAY=$(TZ=Europe/London date +%Y-%m-%d)
          MARKER="snapshots/.daily_sent_${TODAY}"
          echo "event=${{ github.event_name }}"
          echo "today_london=$TODAY"
          # 외부/수동 재실행은 허용. schedule 중복만 스킵.
          if [ -f "$MARKER" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "이미 오늘 자동 리포트 완료 → schedule 스킵"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run report
        if: steps.gate.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: |
          python main.py | tee report_output.txt

      - name: Upload report as artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: daily-report
          path: |
            report_output.txt
            snapshots/**/*.json

      - name: Commit snapshot + daily marker
        if: steps.gate.outputs.skip != 'true'
        run: |
          TODAY=$(TZ=Europe/London date +%Y-%m-%d)
          mkdir -p snapshots
          touch "snapshots/.daily_sent_${TODAY}"
          find snapshots -name '.daily_sent_*' -mtime +7 -delete 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          if git diff --staged --quiet; then
            echo "커밋할 변경 없음"
          else
            git commit -m "chore: 옵션 스냅샷 ${TODAY}"
            git push
          fi
