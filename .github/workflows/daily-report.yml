name: Daily Options Report

# 실행 시각:
#  - 자동: 05:07 UTC ≈ 영국 아침 06:07(BST) / 05:07(GMT).
#    ※ GitHub cron 은 정각(:00)에 지연·스킵이 잦아 분(:07)으로 살짝 어김.
#    화~토 실행 → 전날 미국장(월~금)을 영국 아침에 정리.
#  - 수동: Actions 탭에서 "Run workflow" 로 언제든 실행 가능.
on:
  schedule:
    - cron: "7 5 * * 2-6"
  workflow_dispatch:

# 스냅샷을 repo 에 커밋해야 하므로 쓰기 권한 필요
permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run report
        env:
          # GitHub → Settings → Secrets and variables → Actions 에 등록
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: |
          python main.py | tee report_output.txt

      - name: Upload report as artifact
        uses: actions/upload-artifact@v7
        with:
          name: daily-report
          path: |
            report_output.txt
            snapshots/**/*.json

      - name: Commit today's snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          if git diff --staged --quiet; then
            echo "커밋할 스냅샷 변경 없음"
          else
            git commit -m "chore: 옵션 스냅샷 $(date -u +%Y-%m-%d)"
            git push
          fi
