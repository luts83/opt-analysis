name: Schedule Canary

# public 전환 후 schedule 등록 재검증
"on":
  schedule:
    - cron: "30 6 * * *"
    - cron: "35 6 * * *"
    - cron: "40 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "event=${{ github.event_name }}"
          echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "public-repo schedule canary"
