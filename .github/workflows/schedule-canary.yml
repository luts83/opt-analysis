name: Schedule Canary

# 최소 구성으로 schedule 등록 여부만 확인
"on":
  schedule:
    - cron: "25 6 * * *"
    - cron: "30 6 * * *"
    - cron: "35 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "event=${{ github.event_name }}"
          echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
