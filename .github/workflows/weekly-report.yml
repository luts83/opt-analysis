name: Weekly Validation Report

# 토 아침 ≈ 06:07 / 06:37 BST (UTC 05:07 / 05:37)
"on":
  schedule:
    - cron: "7 5 * * 6"
    - cron: "37 5 * * 6"
  workflow_dispatch:
  repository_dispatch:
    types: [weekly-report]

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly validation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: |
          python weekly.py | tee weekly_output.txt

      - name: Upload weekly report as artifact
        uses: actions/upload-artifact@v7
        with:
          name: weekly-report
          path: |
            weekly_output.txt
            snapshots/**/weekly/*.json

      - name: Commit weekly snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          if git diff --staged --quiet; then
            echo "커밋할 주간 스냅샷 변경 없음"
          else
            git commit -m "chore: 주간 검증 스냅샷 $(TZ=Europe/London date +%Y-%m-%d)"
            git push
          fi
